[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "echomind-backend"
version = "0.1.0"
description = "EchoMind（声忆）— 家庭智能音箱、全龄有声内容库与声纹记忆中枢"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.1",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "edge-tts>=7.0.0",
    "feedparser>=6.0.11",
    "yt-dlp>=2025.1.0",
    "numpy>=2.1.0",
    "miservice-fork>=2.9.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
